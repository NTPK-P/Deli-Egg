<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Deli-Egg!</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lobster&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--o:#3a2a20;--br:#a04e26;--tan:#f0c48c;--cr:#fff8ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--o:#1b1512}}
:root[data-theme=dark]{--o:#1b1512}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--o);font-family:Fredoka,system-ui,sans-serif;color:var(--br);user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:860px;height:100%;margin:auto;background:var(--tan);overflow:hidden}
.s{position:absolute;inset:0;display:none;flex-direction:column;padding:14px}.s.on{display:flex}
.t{font-family:Lobster,cursive;font-weight:400;margin:0}
h1.t{font-size:clamp(60px,17vw,120px);-webkit-text-stroke:12px #fff;paint-order:stroke fill;transform:rotate(-3deg)}
h2.t{font-size:clamp(32px,7vw,48px);-webkit-text-stroke:8px #fff;paint-order:stroke fill;margin:4px 0 10px 4px}
.btn{font:600 16px Fredoka,sans-serif;background:var(--br);color:#fff;border:3px solid #fff;border-radius:16px;padding:8px 16px;cursor:pointer}
.btn.big{background:var(--cr);color:var(--br);border:5px solid var(--br);border-radius:32px;padding:12px 44px;font-size:28px;margin-top:36px}
.btn:focus-visible{outline:3px solid #2f7fd0}
#gr{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:12px;min-height:0;margin-bottom:10px}
.card{position:relative;border:4px solid var(--br);border-radius:8px;background:#ffd99a;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:box-shadow .2s;overflow:hidden}
.card b{font-family:Lobster,cursive;font-weight:400;font-size:clamp(16px,4vw,24px)}
.card span{font-size:clamp(36px,10vw,72px)}.card img{max-height:70%;max-width:80%}
.card:not(.lk):hover{box-shadow:0 0 0 4px #fff6c8,0 0 22px 8px #fff2a0}
.card.sel{outline:4px solid #2f7fd0}
.card.lk{background:#c9a273;cursor:not-allowed}.card.lk span{opacity:.5}
.card em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:clamp(50px,14vw,90px);background:#5a2a1055}
.bar{display:flex;justify-content:space-between}
#rp{position:absolute;inset:8% 0 0;background:var(--tan);border-radius:22px 22px 0 0;padding:14px;transform:translateY(105%);transition:transform .45s;display:flex;flex-direction:column;z-index:5;box-shadow:0 -6px 20px #0006}#rp.o{transform:none}
.tbl{background:#f3efe9;border-radius:14px;padding:16px;flex:1;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start;margin:10px 0;box-shadow:0 2px 8px #0003;min-height:0;position:relative}
.ing{display:flex;align-items:center;gap:8px;width:calc(50% - 8px);font-size:34px}.ing img{height:40px}
.ing span{background:var(--br);color:#fff;border-radius:14px;padding:4px 14px;font-size:16px}
.hd{display:flex;align-items:center;justify-content:space-between}
.pb{width:46px;height:46px;border:3px solid #fff;border-radius:10px;background:var(--br);color:#fff;font-size:20px;cursor:pointer}
#ins{background:var(--cr);border:4px solid #8a5a3c;border-radius:12px;padding:14px;text-align:center;font-weight:600;font-size:clamp(16px,4vw,22px);margin:8px 0 12px}
#tb{display:flex;touch-action:none}
#tm{position:absolute;top:6px;left:0;right:0;text-align:center;font:600 28px Fredoka;color:#5b4536;pointer-events:none}
#L{flex:1;display:flex;flex-wrap:wrap;gap:18px 14px;align-content:center;justify-content:center;padding:34px 8px 8px}
#R{width:42%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:30px}
.it{position:relative;display:flex;flex-direction:column;align-items:center;font-size:52px;line-height:1.1;touch-action:none}
.it small{font:600 12px Fredoka;color:#6b4a3a}.it img,.gh img{height:64px;pointer-events:none}
.it[data-id]{cursor:grab}
.hint{animation:hp .9s infinite}@keyframes hp{50%{transform:translateY(-6px)}}
.wh{animation:sh .15s infinite}@keyframes sh{50%{transform:rotate(6deg)}}
.cn{position:absolute;top:6px;left:0;right:0;display:flex;justify-content:center;font-size:20px;pointer-events:none}.cn b{pointer-events:auto;font-weight:400}
.bw{width:96px;height:60px;background:#f26a3f;border-radius:6px 6px 48px 48px;position:relative;margin:14px auto 0}
.bw i{position:absolute;left:5px;right:5px;top:-10px;height:28px;border-radius:50%;background:#f0c090;display:flex;justify-content:center;align-items:center;font-style:normal;font-size:16px}
.bw.e i{background:#fdf2cf}.bw.w i{background:#f7931e}.bw.c i{background:#cfeaff}
.pg{position:absolute;bottom:-14px;left:0;right:0;height:8px;background:#0003;border-radius:4px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:#4c4}
.st{width:min(36vw,170px);height:min(36vw,170px);border-radius:50%;background:#2c3438;box-shadow:inset 0 0 0 14px #3b464b;position:relative;display:grid;place-items:center}
.st.on{animation:fl 1s infinite}@keyframes fl{50%{box-shadow:inset 0 0 0 14px #3b464b,0 0 24px 8px #4aa8ff}0%,100%{box-shadow:inset 0 0 0 14px #3b464b,0 0 14px 3px #4aa8ff}}
.st .it{font-size:64px}
.kn{width:84px;height:84px;border-radius:50%;background:#d6dde0;position:relative;cursor:pointer;margin-top:16px}
.kn b{position:absolute;inset:16px;border-radius:50%;background:#2b3236;transition:transform .25s}
.kn b::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:22px;margin-left:-2px;background:#fff;border-radius:3px}
.kn u{position:absolute;width:10px;height:10px;border-radius:50%;background:#7b868b}
.kn .a{left:3px;top:37px}.kn .b2{left:37px;top:3px}.kn .c{right:3px;top:37px}
.kn .a.on{background:#3c3}.kn .b2.on{background:#eb3}.kn .c.on{background:#e43}
#kl{font:600 13px Fredoka;color:#5b4536;margin-top:4px}
.ov{position:absolute;inset:0;background:#3a2a2088;display:none;align-items:center;justify-content:center;z-index:9}.ov.on{display:flex}
.pop{background:var(--cr);border:6px solid var(--br);border-radius:24px;padding:18px 28px;text-align:center;width:min(80%,380px);display:flex;flex-direction:column;align-items:center;gap:12px}
.pop .btn{width:70%}.pop .t{font-size:clamp(28px,7vw,44px)}
#fd{font-size:80px}#fd img{height:110px}
.gh{position:fixed;z-index:99;pointer-events:none;font-size:52px;transform:translate(-50%,-50%)}
.shake{animation:sh .15s 3}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.cn img{height:26px}.gh img{height:56px}[data-id=bowl] img{height:76px}
.ib img{height:84px}.ib .cn{top:16px}
.st.im,.st.im.on{width:min(44vw,210px);height:auto;background:none;box-shadow:none;border-radius:0;animation:none;display:block;margin-top:58px}
.st.im>img:first-child{width:100%;height:auto;display:block}
.st.im .it{position:absolute;left:50%;bottom:52%;transform:translateX(-50%);width:64%;z-index:3}
.st.im .it>img{width:100%;height:auto}.st.im .it small{display:none}
.st.im .fr{position:absolute;left:50%;bottom:30%;width:46%;height:auto;transform:translateX(-50%);transform-origin:50% 100%;z-index:2;animation:fk .45s infinite alternate}
@keyframes fk{to{transform:translateX(-50%) scaleY(1.08)}}
.kn.im{width:min(28vw,104px);height:min(28vw,104px);background:none;border-radius:0;margin-top:14px}
.kn.im img{width:100%;height:100%;display:block;pointer-events:none}
.pb.im{background:none;border:0;padding:0;width:52px;height:52px}.pb.im img{width:100%;height:100%;display:block}
.lg0{width:min(78vw,520px);height:auto;display:block}.lg1{height:52px;width:auto;align-self:flex-start;margin:0 0 2px 2px}
.st.im .it.pn{width:88%}
.pg2{position:relative;height:12px;background:#0003;border-radius:6px;overflow:hidden}.pg2 i{display:block;height:100%;width:0;background:#e9a03a}.pg2.ok i{background:#4c4}.pg2 u{position:absolute;left:35%;top:0;bottom:0;width:2px;background:#fff9}
#sp{width:100%;max-width:230px;display:flex;flex-direction:column;gap:6px;font:600 14px Fredoka,sans-serif;color:#5b4536;margin:auto}#shm{min-height:18px;text-align:center;font-size:13px}
#tp{align-self:center;margin-top:4px;background:var(--br);color:#fff;border:3px solid #fff;border-radius:16px;padding:10px 28px;font:600 20px Fredoka,sans-serif;text-align:center;cursor:pointer;line-height:1}#tp small{display:block;font-size:11px;opacity:.8;margin-top:2px}
#tp.cd{opacity:.55}#tp.pr{animation:pr .15s}@keyframes pr{50%{transform:scale(.9)}}.sq{animation:sqz .18s}@keyframes sqz{40%{transform:translateY(-10px) scale(1.06,.9)}}
</style></head><body>
<div id="app">
<section class="s on" id="s0" style="justify-content:center;align-items:center;text-align:center"><img id="lg" alt="Deli-Egg!" style="width:min(82%,540px);height:auto"><p class="t" style="font-size:28px">the minimal egg cooking game</p><button class="btn big" id="go">- Start -</button></section>
<section class="s" id="s1"><img id="lg2" alt="Deli-Egg!" style="height:52px;width:auto;align-self:flex-start"><h2 class="t">Choose Your Menu</h2><div id="gr"></div><div class="bar"><button class="btn" id="bk">Back to Main menu</button><button class="btn" id="lc">Let's Cooking!</button></div><div id="rp"></div></section>
<section class="s" id="s2"><div class="hd"><span style="width:46px"></span><h2 class="t" id="ttl" style="margin:0"></h2><button class="pb" id="pz" aria-label="Pause">❚❚</button></div><div id="ins"></div><div class="tbl" id="tb" style="flex:1;margin:0"><div id="tm"></div><div id="L"></div><div id="R"></div></div></section>
<div class="ov" id="ps"><div class="pop"><h2 class="t" style="-webkit-text-stroke:0">Paused</h2><button class="btn" id="co">Continue</button><button class="btn" id="lv">Leave</button><label style="display:flex;gap:8px;align-items:center;width:80%">🔊<input id="vl" type="range" min="0" max="1" step=".05" value=".7" style="flex:1"></label></div></div>
<div class="ov" id="fin"><div class="pop"><h2 class="t" style="-webkit-text-stroke:0;font-size:26px">You have finished the menu!</h2><div id="fd"></div><h2 class="t" id="fn" style="-webkit-text-stroke:0;font-size:32px"></h2><button class="btn" id="fb">Finish!</button></div></div>
</div>

function whisk(el){const t0=performance.now(),bar=document.createElement('div');bar.className='pg';bar.innerHTML='<i></i>';el.append(bar);el.classList.add('wh');let on=1;
 const stop=()=>{on=0;bar.remove();el.classList.remove('wh');removeEventListener('pointerup',stop)};addEventListener('pointerup',stop);
 (function f(){if(!on)return;if(paused)return stop();const p=(performance.now()-t0)/5000;bar.firstChild.style.width=Math.min(p,1)*100+'%';if(p>=1){stop();s.b=2;nx()}else requestAnimationFrame(f)})()}
setInterval(()=>{if(paused||!$('#s2').classList.contains('on'))return;const x=cur();if(x&&x[1]=='wait'){s.left-=.1;$('#tm').textContent=fmt(s.left);if(s.left<=0)nx()}},100);
const SH=10,TH=.35,TD=350;
const shUI=()=>{const q=s.sh;return `<div id="sp"><div>Shake the pan</div><div class="pg2 ${q.sk>=TH?'ok':''}"><i id="shk" style="width:${q.sk*100}%"></i><u></u></div><div>Shape</div><div class="pg2"><i id="shp" style="width:${q.t/SH*100}%"></i></div><div id="shm">Hold the pan and move up and down</div><div id="tp" role="button">TAP<small>Space</small></div></div>`};
let shT=0;
function shMsg(t){const m=$('#shm');if(!m)return;m.textContent=t;clearTimeout(shT)}
function tapPan(){const x=cur();if(paused||!s||!s.sh||!x||x[1]!='shape')return;const q=s.sh,tp=$('#tp'),im=$('#R .it[data-id=pan] img'),now=performance.now();
 if(now<q.cd)return;q.cd=now+TD;
 if(tp){tp.classList.remove('pr');void tp.offsetWidth;tp.classList.add('pr','cd');setTimeout(()=>tp.classList.remove('cd'),TD)}
 if(q.h&&q.sk>=TH){q.t++;q.sk=Math.max(0,q.sk-.2);beep(480+q.t*40);if(im){im.classList.remove('sq');void im.offsetWidth;im.classList.add('sq')}
  const b=$('#shp');if(b)b.style.width=q.t/SH*100+'%';shMsg(q.t>=SH?'Perfect!':'Nice! Keep going');if(q.t>=SH)nx()}
 else{beep(200);shMsg(q.h?'Shake more before tapping!':'Hold the pan first!')}}
$('#tb').addEventListener('pointerdown',e=>{if(e.target.closest('#tp')){e.preventDefault();tapPan()}});
addEventListener('keydown',e=>{if(e.code!='Space')return;const x=cur();if(!s||paused||!x||x[1]!='shape'||!$('#s2').classList.contains('on'))return;e.preventDefault();if(!e.repeat)tapPan()});
addEventListener('pointermove',e=>{const q=s&&s.sh;if(!q||!q.h||paused)return;q.sk=Math.min(1,q.sk+Math.abs(e.clientY-q.ly)/250);q.ly=e.clientY;q.dy=Math.max(-14,Math.min(14,e.clientY-q.y0))});
const shUp=()=>{if(s&&s.sh){s.sh.h=0;s.sh.dy=0}};addEventListener('pointerup',shUp);addEventListener('pointercancel',shUp);
setInterval(()=>{const x=cur();if(paused||!s||!s.sh||!x||x[1]!='shape'||!$('#s2').classList.contains('on'))return;const q=s.sh;q.sk=Math.max(0,q.sk-.03);const b=$('#shk');if(b){b.style.width=q.sk*100+'%';b.parentNode.classList.toggle('ok',q.sk>=TH)}const im=$('#R .it[data-id=pan] img');if(im&&!im.classList.contains('sq'))im.style.transform=q.h?`translateY(${q.dy}px) rotate(${q.dy/14*-2}deg)`:''},50);
function fin(){paused=1;un=Math.max(un,Math.min(5,pi+2));try{localStorage.setItem('de',un)}catch(e){}$('#fd').innerHTML=ic('d'+pi);$('#fn').textContent=P[pi][1];$('#fin').classList.add('on')}
$('#fb').onclick=()=>{$('#fin').classList.remove('on');s=null;sel=-1;go('s1')};
$('#pz').onclick=()=>{paused=1;$('#ps').classList.add('on')};
$('#co').onclick=()=>{paused=0;$('#ps').classList.remove('on')};
$('#lv').onclick=()=>{$('#ps').classList.remove('on');s=null;paused=0;go('s1')};
if(ASSETS.board)Object.assign($('#tb').style,{background:`url(${ASSETS.board}) center/100% 100% no-repeat`,boxShadow:'none',borderRadius:'0',padding:'20px'});
if(ASSETS.pause){$('#pz').innerHTML=ic('pause');$('#pz').classList.add('im')}
if(ASSETS.logo){$('#lg').src=ASSETS.logo;$('#lg2').src=ASSETS.logo}
$('#vl').oninput=e=>{vol=+e.target.value;beep()};
</script></body></html>
